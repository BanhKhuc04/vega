name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vega-voice unit tests (fake voice, no Piper)
        run: python3 -m unittest discover voice
      - name: pc-agent (wake word, M5.2)
        run: |
          pip install -r pc-agent/requirements.txt
          pip install --no-deps openwakeword==0.6.0
          python -m unittest discover pc-agent
          PC_AGENT_PYTHON=python npx vitest run brain/tests/pc-agent.test.ts
      - name: Provider bench (mock only, no API keys in CI)
        run: npm run bench -- --provider mock
      - run: npm run build
      - run: npm run build -w brain
      - run: npm run size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          MQTT_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: dashboard/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build vega-ui image
        run: docker build -f dashboard/Dockerfile -t vega-ui:ci .
      - name: Image serves the dashboard
        run: |
          docker run -d --name ui -p 8080:80 -e VEGA_SOURCE=mock vega-ui:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break || sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "VEGA Core"
          curl -fs http://localhost:8080/config.js | grep -q 'source: "mock"'
      - name: Image routes /voice/* without vega-voice or the brain (502, nginx still starts)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/voice/tts?text=hi&lang=en')" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/voice/stt)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/vision/frame/abcdefgh12)" = 502
      - uses: docker/setup-qemu-action@v3 # vega-voice runs pip on arm64: wheels only, nothing compiled
      - name: Build vega-voice image (amd64 + arm64 for the Pi)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f voice/Dockerfile -t vega-voice:ci .
      - name: vega-voice speaks Vietnamese
        run: |
          docker buildx build --load -f voice/Dockerfile -t vega-voice:ci .
          docker run -d --name voice -p 5002:5002 vega-voice:ci
          for i in $(seq 1 30); do curl -fs http://localhost:5002/health >/dev/null && break || sleep 1; done
          curl -fs -o hi.wav 'http://localhost:5002/voice/tts?text=Xin%20ch%C3%A0o&lang=vi'
          file hi.wav | grep -q 'WAVE audio'
          test "$(stat -c %s hi.wav)" -gt 10000
      - name: Pi compose file is valid
        run: MQTT_BRAIN_PASS=x MQTT_UI_PASS=x docker compose -f infra/pi/docker-compose.yml config -q
      - name: Build vega-brain image (amd64 + arm64 for the Pi)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f brain/Dockerfile -t vega-brain:ci .
      - name: Brain image starts and reaches a broker
        run: |
          docker buildx build --load -f brain/Dockerfile -t vega-brain:ci .
          docker network create vega
          docker run -d --name mq --network vega eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name brain --network vega -e MQTT_URL=mqtt://mq:1883 vega-brain:ci
          for i in $(seq 1 20); do docker logs brain 2>&1 | grep -q 'connected to' && break || sleep 1; done
          docker logs brain
          docker logs brain 2>&1 | grep -q 'connected to mqtt://mq:1883'
          docker run --rm --entrypoint v4l2-ctl vega-brain:ci --version # takes the Vision photo (M7)

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infra/pi/setup.sh dashboard/docker/40-vega-config.sh
      - run: shellcheck -x infra/pi/setup.sh dashboard/docker/40-vega-config.sh
