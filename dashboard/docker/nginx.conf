server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 512;

  # runtime settings must never be cached
  location = /config.js {
    add_header Cache-Control "no-store";
  }
  # hashed build assets can be cached for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Upstreams are looked up per request (Docker's DNS), not at start: the image also runs alone (CI, sim compose),
  # where mosquitto, vega-brain and vega-voice do not exist. Those routes then answer 502, the page still loads.
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 3s;
  set $mosquitto mosquitto:9001;
  set $brain vega-brain:8091;
  set $voice vega-voice:5002;
  set $vision vega-vision:8092;

  # MQTT over WebSocket on the page's own address: an HTTPS page (tailscale serve) cannot open ws://host:9001
  location = /mqtt {
    proxy_pass http://$mosquitto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  # speech to text: the brain holds the STT key and the daily cap (15 s of audio is well under 1 MB)
  location = /voice/stt {
    client_max_body_size 1m;
    proxy_pass http://$brain;
    proxy_read_timeout 30s;
  }
  # the photo the Vision screen shows (M7): from the brain's memory, gone after 2 minutes, never cached
  location /vision/frame/ {
    proxy_pass http://$brain;
    proxy_read_timeout 15s;
    access_log off;
  }
  # live video and its YOLO boxes (M7.1): streamed as they come, never buffered or cached. /snapshot is not forwarded
  location /vision/live {
    proxy_pass http://$vision;
    proxy_buffering off;
    proxy_read_timeout 1h;
    access_log off;
  }
  # the Console's API (M8): JSON from the brain, which checks the bearer token; never cached
  location /api/ {
    client_max_body_size 4k;
    proxy_pass http://$brain;
    proxy_read_timeout 60s;
  }
  # text to speech: Piper in vega-voice
  location = /voice/tts {
    proxy_pass http://$voice;
    proxy_read_timeout 30s;
    access_log off; # the URL carries what VEGA says
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
