# VEGA on the Raspberry Pi: authenticated, with per-user ACL. TLS arrives with remote access (M8).
# Exposure is set by the port bindings in docker-compose.yml: 1883 on the LAN (ESP devices), 9001 only on
# localhost and the Tailscale address (see docs/security.md). Never forward these ports on the router.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# plain MQTT for ESP devices, the brain and tools
listener 1883
protocol mqtt

# MQTT over WebSocket for the dashboard (browser): published on localhost + Tailscale only
listener 9001
protocol websockets
