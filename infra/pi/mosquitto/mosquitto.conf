# VEGA on the Raspberry Pi: authenticated, with per-user ACL. Both listeners are for the LAN only
# (do not forward these ports on the router). TLS arrives with remote access (M8).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# plain MQTT for ESP devices, the brain and tools
listener 1883
protocol mqtt

# MQTT over WebSocket for the dashboard (browser)
listener 9001
protocol websockets
