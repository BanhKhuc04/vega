# VEGA on a Raspberry Pi 3 (64-bit OS):  cd infra/pi && docker compose up -d
# setup.sh prepares .env, mosquitto/passwd and everything else. Run it first.
name: vega
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # plain MQTT on the LAN, for ESP devices (user `device` cannot publish commands)
      - "${MQTT_PORT:-1883}:1883"
      # WebSocket for dashboards: localhost (kiosk) and Tailscale only, never the LAN (docs/security.md).
      # Without TAILSCALE_IP the second line binds 127.0.0.2, another loopback address: localhost only.
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"
      - "${TAILSCALE_IP:-127.0.0.2}:${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u brain -P \"$$MQTT_BRAIN_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      MQTT_BRAIN_PASS: ${MQTT_BRAIN_PASS:?run setup.sh first}

  vega-ui:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    image: vega-ui:local
    restart: unless-stopped
    ports:
      # the page carries the `ui` MQTT password (it may publish commands): same exposure as the WebSocket
      - "127.0.0.1:${UI_PORT:-8080}:80"
      - "${TAILSCALE_IP:-127.0.0.2}:${UI_PORT:-8080}:80"
    environment:
      VEGA_SOURCE: mqtt
      # empty = ws://<host that served the page>:9001
      VEGA_MQTT_URL: ""
      VEGA_MQTT_USER: ui
      VEGA_MQTT_PASS: ${MQTT_UI_PASS:?run setup.sh first}
      VEGA_ROOM: ${VEGA_ROOM:-bedroom}
    depends_on:
      - mosquitto
    mem_limit: 48m

  vega-brain:
    build:
      context: ../..
      dockerfile: brain/Dockerfile
    image: vega-brain:local
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: brain
      MQTT_PASS: ${MQTT_BRAIN_PASS:?run setup.sh first}
      VEGA_ROOM: ${VEGA_ROOM:-bedroom}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # AI providers, budget, rate limit: brain.env (copy brain.env.example). Optional: without it only local commands work.
    env_file:
      - path: ./brain.env
        required: false
    volumes:
      - brain-data:/data
    depends_on:
      - mosquitto
    mem_limit: 160m

volumes:
  mosquitto-data:
  brain-data:
