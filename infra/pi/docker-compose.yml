# VEGA on a Raspberry Pi 4 (64-bit OS):  cd infra/pi && docker compose up -d
# setup.sh prepares .env, mosquitto/passwd and everything else. Run it first.
name: vega
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # plain MQTT on the LAN, for ESP devices (user `device` cannot publish commands)
      - "${MQTT_PORT:-1883}:1883"
      # WebSocket for dashboards: localhost (kiosk) and Tailscale only, never the LAN (docs/security.md).
      # Without TAILSCALE_IP the second line binds 127.0.0.2, another loopback address: localhost only.
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"
      - "${TAILSCALE_IP:-127.0.0.2}:${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u brain -P \"$$MQTT_BRAIN_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      MQTT_BRAIN_PASS: ${MQTT_BRAIN_PASS:?run setup.sh first}

  vega-ui:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    image: vega-ui:local
    restart: unless-stopped
    ports:
      # the page carries the `ui` MQTT password (it may publish commands): same exposure as the WebSocket
      - "127.0.0.1:${UI_PORT:-8080}:80"
      - "${TAILSCALE_IP:-127.0.0.2}:${UI_PORT:-8080}:80"
    environment:
      VEGA_SOURCE: mqtt
      # through this page's nginx: Chrome refused the page's ws:// to port 9001 on the Tailscale address (2026-11)
      VEGA_MQTT_URL: /mqtt
      VEGA_MQTT_USER: ui
      VEGA_MQTT_PASS: ${MQTT_UI_PASS:?run setup.sh first}
      VEGA_ROOM: ${VEGA_ROOM:-bedroom}
      # the Console's API token (M8): same exposure as the `ui` password above
      VEGA_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
    depends_on:
      - mosquitto
    mem_limit: 48m

  vega-brain:
    build:
      context: ../..
      dockerfile: brain/Dockerfile
    image: vega-brain:local
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: brain
      MQTT_PASS: ${MQTT_BRAIN_PASS:?run setup.sh first}
      VEGA_ROOM: ${VEGA_ROOM:-bedroom}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # the brain publishes this Pi's temperature, CPU, RAM and uptime on vega/system/pi
      PI_STATS: "1"
      # /voice/stt for push-to-talk, reached only by vega-ui's nginx over the compose network (no host port)
      VOICE_PORT: "8091"
      VOICE_HOST: 0.0.0.0
      # Vision (M7): photos come from vega-vision, the only container that opens the camera (brief 0011, L1)
      VISION_URL: http://vega-vision:8092
      # the host's /dev, read-only, only to see whether the camera is plugged in (the CAM OFF chip); the brain never opens it
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/hostdev/video0}
      # M8: Alerts from vega/system/health and vega/system/backup, disk and temperature; the Console API's token
      HEALTH_WATCH: "1"
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
    # AI providers, budget, rate limit: brain.env (copy brain.env.example). Optional: without it only local commands work.
    env_file:
      - path: ./brain.env
        required: false
    volumes:
      - brain-data:/data
      - /dev:/hostdev:ro
    depends_on:
      - mosquitto
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/voice/stt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Piper reads answers aloud, offline (M5). No port on the host: vega-ui's nginx forwards /voice/tts to it.
  vega-voice:
    build:
      context: ../..
      dockerfile: voice/Dockerfile
    image: vega-voice:local
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5002/health',timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3

  # The camera, live video and YOLO for the Vision screen (M7.1). No port on the host: vega-ui's nginx forwards /vision/live*
  # to it, and the brain asks it for /snapshot. The camera runs only while someone watches or a photo is taken.
  vega-vision:
    build:
      context: ../..
      dockerfile: vision/Dockerfile
    image: vega-vision:local
    restart: unless-stopped
    environment:
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/hostdev/video0}
      CAMERA_SIZE: ${CAMERA_SIZE:-1280x720}
      LIVE_FPS: ${LIVE_FPS:-10}
      DETECT_HZ: ${DETECT_HZ:-4}
      LIVE_MAX_MIN: ${LIVE_MAX_MIN:-15}
    # The host's /dev is mounted read-only at /hostdev and only video4linux devices (major 81) may be opened: the camera
    # can be plugged in or out while it runs. A `devices:` entry would refuse to start the container while it is unplugged.
    device_cgroup_rules:
      - "c 81:* rmw"
    # the host's `video` group (44 on Raspberry Pi OS / Debian), which owns /dev/video*
    group_add:
      - "${VIDEO_GID:-44}"
    volumes:
      - /dev:/hostdev:ro
    # YOLO gets two of the Pi's four cores; the brain, broker and dashboard keep the others (L10)
    cpus: 2
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8092/health',timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  mosquitto-data:
  brain-data:
